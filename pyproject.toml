[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "podcontrol"
version = "0.1.0"
description = "Control a pod of RMS meteor cameras (IMX291 or Goke/IMX307) as one — unified preview, exposure/gain, and (WIP) white balance."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Luc Busquin"}]
# OpenCV and numpy are deliberately NOT pip dependencies: the RMS venv
# (~/vRMS, --system-site-packages) uses the system python3-opencv + numpy 1.26,
# and a pip opencv-python (5.x pulls numpy>=2) breaks RMS's compiled extensions.
dependencies = ["Pillow>=9"]

[project.scripts]
podcontrol = "podcontrol.app:main"

[tool.setuptools.packages.find]
include = ["podcontrol*"]

# defaults.json is the pod's working configuration, shipped so a fresh install
# starts set up rather than on generic values (podcontrol/settings.py).
[tool.setuptools.package-data]
podcontrol = ["defaults.json"]
